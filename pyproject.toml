[project]
name = "tornet"
version = "1.0.0"
description = "TorNet tornado detection: the MIT-LL CNN baseline and a CNN-transformer hybrid"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "MIT Lincoln Laboratory, Group 43", email = "mark.veillette@ll.mit.edu" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "xarray>=2024.1",
  "netCDF4>=1.7",
  "matplotlib>=3.8",
  "tqdm",
]

[project.optional-dependencies]
# Keras 3 only; bring your own backend (tensorflow, torch or jax).
keras = ["keras>=3.0"]
# Keras 3 on the torch backend.
torch = ["keras>=3.0", "torch>=2.7"]
# Download pretrained weights from Hugging Face.
hf = ["huggingface_hub"]
notebooks = ["jupyter"]

[project.scripts]
tornet-train = "tornet.scripts.train_keras:cli"
tornet-test = "tornet.scripts.test_keras:main"
tornet-results = "tornet.scripts.results:main"
tornet-score = "tornet.scripts.score:main"
tornet-cache-features = "tornet.scripts.cache_features:main"
tornet-train-head = "tornet.scripts.train_head:cli"

[project.urls]
Homepage = "https://github.com/mit-ll/tornet"
Paper = "https://doi.org/10.1175/AIES-D-24-0006.1"
Dataset = "https://doi.org/10.5281/zenodo.12636522"
Weights = "https://huggingface.co/tornet-ml/tornado_detector_baseline_v1"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "ty>=0.0.85",
]
# Pulls in the torch extra by default so `uv sync` and `uv run` give a working backend.
torch = ["tornet[torch]"]
# tornet-test downloads the pretrained weights from Hugging Face by default.
hf = ["tornet[hf]"]

[tool.uv]
default-groups = ["dev", "torch", "hf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tornet"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Line length is enforced by the formatter; the license headers contain long legal lines.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tornet"]

[tool.ty.src]
include = ["src", "tests"]

# ty is advisory while the package is still mostly unannotated. Rules below fire on the
# upstream code and are warnings so `uv run ty check` reports them without failing.
[tool.ty.rules]
invalid-argument-type = "warn"
unresolved-import = "warn"
unresolved-attribute = "warn"
unknown-argument = "warn"
invalid-method-override = "warn"
invalid-assignment = "warn"
invalid-return-type = "warn"
too-many-positional-arguments = "warn"
index-out-of-bounds = "warn"
