[project]
name = "tornet"
version = "1.0.0"
description = "Tools for working with the TorNet tornado detection dataset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "MIT Lincoln Laboratory, Group 43", email = "mark.veillette@ll.mit.edu" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "xarray>=2024.1",
  "netCDF4>=1.7",
  "matplotlib>=3.8",
  "tqdm",
]

[project.optional-dependencies]
# Keras 3 only; bring your own backend (tensorflow, torch or jax).
keras = ["keras>=3.0"]
# Keras 3 on the torch backend, plus the standalone Lightning port in tornet.models.torch.
torch = [
  "keras>=3.0",
  "torch>=2.7",
  "torchvision",
  "torchmetrics",
  "lightning>=2.0",
]
# Download pretrained weights from Hugging Face.
hf = ["huggingface_hub"]
notebooks = ["jupyter"]

[project.scripts]
tornet-train = "tornet.scripts.train_keras:cli"
tornet-test = "tornet.scripts.test_keras:main"

[project.urls]
Homepage = "https://github.com/mit-ll/tornet"
Paper = "https://doi.org/10.1175/AIES-D-24-0006.1"
Dataset = "https://doi.org/10.5281/zenodo.12636522"
Weights = "https://huggingface.co/tornet-ml/tornado_detector_baseline_v1"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tornet"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
